<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>TikTok Saver - تحميل فيديوهات تيك توك بدون علامة مائية</title>
<meta name="description" content="تحميل فيديوهات وقصص تيك توك بدون علامة مائية - سريع، آمن ومجاني">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --accent-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
  --dark-bg: #0f0c29;
  --darker-bg: #0a0818;
  --card-bg: rgba(255, 255, 255, 0.08);
  --card-hover: rgba(255, 255, 255, 0.12);
  --text-primary: #ffffff;
  --text-secondary: #b8c5d6;
  --border-radius: 16px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
}

/* تنسيق بسيط للعناصر */
nav, footer, .container {
  opacity: 0;
  transform: translateY(20px);
  transition: var(--transition);
}
nav.show, footer.show, .container.show, .features-container.show, .info-section.show {
  opacity: 1;
  transform: translateY(0);
}

.container {
  text-align: center;
  padding: 80px 20px;
}

input {
  width: 80%;
  max-width: 500px;
  padding: 12px;
  border-radius: var(--border-radius);
  border: none;
  outline: none;
  margin: 10px 0;
}

button {
  border: none;
  cursor: pointer;
  border-radius: var(--border-radius);
  padding: 12px 20px;
  font-weight: 600;
  margin: 5px;
  color: white;
}

button.download { background: var(--primary-gradient); }
button.story { background: var(--secondary-gradient); }
button.mp3 { background: var(--accent-gradient); }

.loading-state {
  text-align: center;
  margin-top: 30px;
}

.spinner {
  border: 4px solid rgba(255,255,255,0.2);
  border-top: 4px solid #fff;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: auto;
  animation: spin 1s linear infinite;
}

@keyframes spin { 100% { transform: rotate(360deg); } }

.custom-alert {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--card-bg);
  color: white;
  padding: 12px 20px;
  border-radius: var(--border-radius);
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translateY(-10px);
  transition: var(--transition);
  z-index: 9999;
}
.custom-alert.show {
  opacity: 1;
  transform: translateY(0);
}
.video-preview video {
  max-width: 100%;
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<nav>
  <div class="logo">
    <i class="fa-brands fa-tiktok"></i>
    <span>TikTok Saver</span>
  </div>
</nav>

<div class="container">
  <h1>🚀 تنزيل فيديوهات تيك توك</h1>
  <p class="subtitle">ألصق رابط الفيديو أو القصة واضغط التحميل — سريع، آمن، وبدون علامة مائية.</p>
  <div class="input-group">
    <input type="url" id="videoUrl" placeholder="ضع رابط الفيديو أو القصة هنا" aria-label="رابط الفيديو">
    <div>
      <button class="download" id="btn-video"><i class="fa-solid fa-download"></i> تحميل فيديو</button>
      <button class="story" id="btn-story"><i class="fa-solid fa-images"></i> تحميل قصة</button>
      <button class="mp3" id="btn-mp3"><i class="fa-solid fa-music"></i> تحميل MP3</button>
    </div>
  </div>
</div>

<div id="result"></div>

<footer>
  <span>© 2025 جميع الحقوق محفوظة — موقعك</span>
</footer>

<script>
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.querySelector('nav').classList.add('show'), 100);
  setTimeout(() => document.querySelector('.container').classList.add('show'), 200);
  setTimeout(() => document.querySelector('footer').classList.add('show'), 400);
});

// دالة التحميل وعرض الفيديو مباشرة
async function downloadContent(type) {
  const url = document.getElementById("videoUrl").value.trim();
  const resultDiv = document.getElementById("result");
  
  if (!url) return showAlert("أدخل الرابط أولاً");
  if (!url.includes('tiktok.com')) return showAlert("الرجاء إدخال رابط تيك توك صحيح");

  resultDiv.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>جاري تجهيز المحتوى...</p>
    </div>
  `;

  try {
    const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
    const response = await fetch(apiUrl);
    const data = await response.json();

    if (data.code === 0 && data.data) {
      let downloadUrl, filename, label;
      
      if (type === 'video') {
        downloadUrl = data.data.play;
        filename = `tiktok_video_${Date.now()}.mp4`;
        label = "الفيديو";
      } else if (type === 'mp3') {
        downloadUrl = data.data.music;
        filename = `tiktok_audio_${Date.now()}.mp3`;
        label = "الصوت";
      } else {
        downloadUrl = data.data.play;
        filename = `tiktok_story_${Date.now()}.mp4`;
        label = "القصة";
      }

      // عرض المحتوى في الصفحة
      resultDiv.innerHTML = `
        <div class="video-preview" style="text-align:center; margin-top:25px;">
          ${type === 'mp3' ? `
            <audio controls style="width:90%;"><source src="${downloadUrl}" type="audio/mpeg"></audio>
          ` : `
            <video controls autoplay playsinline>
              <source src="${downloadUrl}" type="video/mp4">
              متصفحك لا يدعم تشغيل الفيديو.
            </video>
          `}
          <div style="margin-top:15px;">
            <button onclick="forceDownload('${downloadUrl}', '${filename}')" style="background: var(--success-gradient); padding:10px 25px; border:none; border-radius:12px; color:white; font-weight:600;">
              <i class="fa-solid fa-download"></i> تحميل ${label}
            </button>
          </div>
        </div>
      `;
      showAlert(`✅ تم تجهيز ${label}! يمكنك مشاهدته أو تحميله الآن.`);
    } else {
      throw new Error(data.msg || 'فشل في تحميل المحتوى');
    }

  } catch (error) {
    resultDiv.innerHTML = `<div style="text-align:center;color:#f88;">❌ حدث خطأ: ${error.message}</div>`;
  }
}

// تحميل مباشر
function forceDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// تنبيه بسيط
function showAlert(message) {
  const alertDiv = document.createElement('div');
  alertDiv.className = 'custom-alert';
  alertDiv.innerHTML = `<div class="alert-content"><i class="fa-solid fa-circle-info"></i> ${message}</div>`;
  document.body.appendChild(alertDiv);
  setTimeout(() => alertDiv.classList.add('show'), 100);
  setTimeout(() => {
    alertDiv.classList.remove('show');
    setTimeout(() => alertDiv.remove(), 300);
  }, 4000);
}

document.getElementById('btn-video').addEventListener('click', () => downloadContent('video'));
document.getElementById('btn-story').addEventListener('click', () => downloadContent('story'));
document.getElementById('btn-mp3').addEventListener('click', () => downloadContent('mp3'));
</script>

</body>
</html>
