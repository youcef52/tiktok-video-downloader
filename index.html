<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>TikTok Saver - تحميل فيديوهات تيك توك بدون علامة مائية</title>
<meta name="description" content="تحميل فيديوهات وقصص تيك توك بدون علامة مائية - سريع، آمن ومجاني">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --accent-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
  --dark-bg: #0f0c29;
  --darker-bg: #0a0818;
  --card-bg: rgba(255, 255, 255, 0.08);
  --card-hover: rgba(255, 255, 255, 0.12);
  --text-primary: #ffffff;
  --text-secondary: #b8c5d6;
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.3);
  --border-radius: 16px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
  background-attachment: fixed;
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(249, 168, 212, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 40% 20%, rgba(96, 165, 250, 0.1) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

nav {
  background: rgba(15, 12, 41, 0.8);
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  position: sticky;
  top: 0;
  opacity: 0;
  transform: translateY(-30px);
  transition: var(--transition);
  z-index: 100;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}

nav.show {
  opacity: 1;
  transform: translateY(0);
}

nav .logo {
  font-weight: 700;
  font-size: 22px;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: flex;
  align-items: center;
  gap: 10px;
}

nav .logo i {
  font-size: 28px;
  background: var(--secondary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.container {
  max-width: 700px;
  width: 90%;
  margin: 40px auto;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px 30px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  opacity: 0;
  transform: translateY(30px);
  transition: var(--transition);
  border: 1px solid rgba(255, 255, 255, 0.1);
  position: relative;
  z-index: 1;
}

.container.show {
  opacity: 1;
  transform: translateY(0);
}

h1 {
  margin: 0 0 15px;
  font-size: 32px;
  line-height: 1.3;
  font-weight: 700;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  color: var(--text-secondary);
  margin-bottom: 30px;
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
}

.input-group {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

input {
  flex: 1;
  min-width: 200px;
  padding: 16px 20px;
  border-radius: 14px;
  border: 2px solid rgba(255, 255, 255, 0.1);
  outline: none;
  font-size: 15px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  transition: var(--transition);
  font-family: inherit;
}

input:focus {
  border-color: rgba(102, 126, 234, 0.6);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

button {
  padding: 16px 24px;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: var(--transition);
  white-space: nowrap;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}

button.download {
  background: var(--secondary-gradient);
  color: var(--text-primary);
  box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
}

button.download:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
}

button.story {
  background: var(--success-gradient);
  color: var(--text-primary);
  box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
}

button.story:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
}

button.mp3 {
  background: var(--accent-gradient);
  color: var(--text-primary);
  box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
}

button.mp3:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(250, 112, 154, 0.6);
}

#result {
  max-width: 700px;
  margin: 30px auto;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  font-size: 16px;
  word-break: break-word;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 1;
}

.loading-state {
  text-align: center;
  padding: 40px 20px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255, 255, 255, 0.1);
  border-top: 4px solid #4facfe;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.success-result {
  background: rgba(79, 172, 254, 0.1);
  border: 1px solid rgba(79, 172, 254, 0.3);
  border-radius: 16px;
  padding: 25px;
  text-align: center;
}

.error-result {
  background: rgba(245, 87, 108, 0.1);
  border: 1px solid rgba(245, 87, 108, 0.3);
  border-radius: 16px;
  padding: 25px;
  text-align: center;
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

.result-header i {
  font-size: 24px;
  color: #4facfe;
}

.error-result i {
  color: #f5576c;
}

.result-header h3 {
  margin: 0;
  color: var(--text-primary);
}

.download-link {
  display: inline-block;
  padding: 12px 24px;
  background: var(--success-gradient);
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
  margin: 10px 5px;
  transition: var(--transition);
}

.download-link:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
}

.retry-btn {
  background: var(--secondary-gradient);
  color: var(--text-primary);
  border: none;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
}

.retry-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
}

.custom-alert {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--success-gradient);
  color: white;
  padding: 15px 20px;
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  z-index: 10000;
  transform: translateX(400px);
  transition: transform 0.3s ease;
  max-width: 300px;
}

.custom-alert.show {
  transform: translateX(0);
}

.alert-content {
  display: flex;
  align-items: center;
  gap: 10px;
}

.alert-content i {
  font-size: 18px;
}

.loading {
  pointer-events: none;
  opacity: 0.7;
}

.loading::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@media(max-width: 768px) {
  .input-group {
    flex-direction: column;
    gap: 12px;
  }
 
  input, button {
    width: 100%;
  }
}
</style>
</head>
<body>

<nav>
  <div class="logo">
    <i class="fa-brands fa-tiktok"></i>
    <span>TikTok Saver</span>
  </div>
</nav>

<div class="container">
  <h1>🚀 تنزيل فيديوهات تيك توك</h1>
  <p class="subtitle">ألصق رابط الفيديو أو القصة واضغط التحميل — سريع، آمن، وبدون علامة مائية.</p>
  <div class="input-group">
    <input type="url" id="videoUrl" placeholder="ضع رابط الفيديو أو القصة هنا">
    <button class="download" id="btn-video">
      <i class="fa-solid fa-download"></i>
      <span>تحميل فيديو</span>
    </button>
    <button class="story" id="btn-story">
      <i class="fa-solid fa-images"></i>
      <span>تحميل قصة</span>
    </button>
    <button class="mp3" id="btn-mp3">
      <i class="fa-solid fa-music"></i>
      <span>تحميل MP3</span>
    </button>
  </div>
</div>

<div id="result"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.querySelector('nav').classList.add('show'), 100);
  setTimeout(() => document.querySelector('.container').classList.add('show'), 200);
});

// 🔥 دالة التحميل المباشر - الإصلاح النهائي
async function downloadContent(type) {
  const url = document.getElementById("videoUrl").value.trim();
  const btnVideo = document.getElementById('btn-video');
  const btnStory = document.getElementById('btn-story');
  const btnMp3 = document.getElementById('btn-mp3');
  const resultDiv = document.getElementById("result");
 
  if (!url) {
    showAlert("أدخل الرابط أولا");
    return;
  }

  if (!url.includes('tiktok.com')) {
    showAlert("الرجاء إدخال رابط تيك توك صحيح");
    return;
  }
 
  let activeBtn;
  if (type === 'video') activeBtn = btnVideo;
  else if (type === 'story') activeBtn = btnStory;
  else if (type === 'mp3') activeBtn = btnMp3;
 
  resultDiv.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>جاري تجهيز ${type === 'video' ? 'الفيديو' : type === 'mp3' ? 'الصوت' : 'القصة'}...</p>
    </div>
  `;
  
  activeBtn.classList.add('loading');
  activeBtn.disabled = true;
 
  try {
    // استخدام السيرفر الخاص بك
    const response = await fetch('/download', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        url: url,
        type: type
      })
    });
    
    const data = await response.json();
    
    if (data.success && data.download) {
      // 🔥 الإصلاح: إنشاء رابط تحميل مخفي
      const link = document.createElement('a');
      link.href = data.download;
      link.download = data.filename;
      link.style.display = 'none';
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      resultDiv.innerHTML = `
        <div class="success-result">
          <div class="result-header">
            <i class="fa-solid fa-circle-check"></i>
            <h3>تم البدء في التحميل!</h3>
          </div>
          <p>جاري تحميل ${type === 'video' ? 'الفيديو' : type === 'mp3' ? 'الصوت' : 'القصة'} إلى جهازك...</p>
          <p style="font-size: 14px; color: var(--text-secondary); margin-top: 15px;">
            إذا لم يبدأ التحميل تلقائياً، 
            <a href="${data.download}" download="${data.filename}" class="download-link">
              اضغط هنا للتحميل المباشر
            </a>
          </p>
        </div>
      `;
      
      showAlert('بدأ التحميل! تحقق من مجلد التنزيلات');
      
    } else {
      throw new Error(data.error || 'فشل في تحميل المحتوى');
    }
  } catch (err) {
    console.error('❌ خطأ:', err);
    resultDiv.innerHTML = `
      <div class="error-result">
        <div class="result-header">
          <i class="fa-solid fa-circle-xmark"></i>
          <h3>خطأ في التحميل</h3>
        </div>
        <p>${err.message}</p>
        <button class="retry-btn" onclick="downloadContent('${type}')">
          <i class="fa-solid fa-rotate"></i>
          إعادة المحاولة
        </button>
      </div>
    `;
  } finally {
    activeBtn.classList.remove('loading');
    activeBtn.disabled = false;
  }
}

function showAlert(message) {
  const alertDiv = document.createElement('div');
  alertDiv.className = 'custom-alert';
  alertDiv.innerHTML = `
    <div class="alert-content">
      <i class="fa-solid fa-circle-info"></i>
      <span>${message}</span>
    </div>
  `;
  
  document.body.appendChild(alertDiv);
  
  setTimeout(() => alertDiv.classList.add('show'), 100);
  setTimeout(() => {
    alertDiv.classList.remove('show');
    setTimeout(() => document.body.removeChild(alertDiv), 300);
  }, 4000);
}

document.getElementById('btn-video').addEventListener('click', () => downloadContent('video'));
document.getElementById('btn-story').addEventListener('click', () => downloadContent('story'));
document.getElementById('btn-mp3').addEventListener('click', () => downloadContent('mp3'));

document.getElementById('videoUrl').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') downloadContent('video');
});
</script>

</body>
</html>
