<script>
// متغيرات لإدارة خيارات الجودة
let currentDownloadType = '';
let currentVideoUrl = '';
let currentVideoData = null;

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.querySelector('nav').classList.add('show'), 100);
  setTimeout(() => document.querySelector('.container').classList.add('show'), 200);
  setTimeout(() => document.querySelector('.features-container').classList.add('show'), 300);
  setTimeout(() => document.querySelector('.info-section').classList.add('show'), 400);
  setTimeout(() => document.querySelector('footer').classList.add('show'), 500);
  
  // إخفاء خيارات الجودة في البداية
  document.getElementById('qualityOptions').style.display = 'none';
});

// دالة لإظهار خيارات الجودة مباشرة
async function showQualityOptions(type) {
  const url = document.getElementById("videoUrl").value.trim();
  
  if (!url) {
    showAlert("أدخل الرابط أولا");
    return;
  }

  if (!url.includes('tiktok.com')) {
    showAlert("الرجاء إدخال رابط صحيح");
    return;
  }
  
  currentDownloadType = type;
  currentVideoUrl = url;
  
  try {
    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p>جاري تحضير خيارات التحميل...</p>
      </div>
    `;

    // استخدام API لتحليل الفيديو
    const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
    
    const response = await fetch(apiUrl);
    const data = await response.json();
    
    if (data.code === 0 && data.data) {
      currentVideoData = data.data;
      
      // إظهار خيارات الجودة مباشرة
      const qualityOptions = document.getElementById('qualityOptions');
      const qualityTitle = document.getElementById('quality-title');
      
      qualityTitle.textContent = `اختر جودة التحميل لـ ${type === 'video' ? 'الفيديو' : type === 'mp3' ? 'الصوت' : 'القصة'}`;
      qualityOptions.style.display = 'block';
      
      // تحديث معاينة الفيديو الصغيرة
      updateSmallPreviews(data.data.play);
      
      resultDiv.innerHTML = '';
      
      // تمرير للأعلى لرؤية خيارات الجودة
      qualityOptions.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      
      showAlert(`✓ جاهز للتحميل! اختر الجودة المناسبة`);
      
    } else {
      throw new Error(data.msg || 'فشل في تحليل الفيديو');
    }
    
  } catch (error) {
    console.error('Error:', error);
    document.getElementById("result").innerHTML = `
      <div class="error-result">
        <div class="result-header">
          <i class="fa-solid fa-circle-xmark"></i>
          <h3>خطأ في التحليل</h3>
        </div>
        <p>${error.message || 'حدث خطأ غير متوقع'}</p>
        <button class="retry-btn" onclick="showQualityOptions('${type}')">
          <i class="fa-solid fa-rotate"></i>
          إعادة المحاولة
        </button>
      </div>
    `;
  }
}

// تحديث المعاينات الصغيرة بالفيديو الحقيقي
function updateSmallPreviews(videoUrl) {
  const previews = document.querySelectorAll('.video-preview-small');
  previews.forEach(preview => {
    const icon = preview.querySelector('.preview-icon');
    icon.style.display = 'none';
    
    // إنشاء عنصر فيديو صغير
    const video = document.createElement('video');
    video.src = videoUrl;
    video.muted = true;
    video.playsInline = true;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'cover';
    video.style.borderRadius = '4px';
    
    // إضافة الفيديو إلى المعاينة
    preview.appendChild(video);
    
    // تشغيل الفيديو تلقائياً
    video.play().catch(e => {
      console.log('Auto-play prevented, showing fallback icon');
      icon.style.display = 'flex';
    });
  });
}

// دالة التحميل المباشرة بدون فتح صفحات جديدة
async function downloadWithQuality(quality) {
  const resultDiv = document.getElementById("result");
  const qualityOptions = document.getElementById('qualityOptions');
  
  if (!currentVideoData) {
    showAlert("يجب تحضير الفيديو أولاً");
    return;
  }
  
  // إخفاء خيارات الجودة
  qualityOptions.style.display = 'none';
  
  // إظهار حالة التحميل
  resultDiv.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>جاري تحميل ${currentDownloadType === 'video' ? 'الفيديو' : currentDownloadType === 'mp3' ? 'الصوت' : 'القصة'} بجودة ${quality}p...</p>
      <p style="font-size: 14px; color: var(--text-secondary); margin-top: 10px;">جاري التحميل المباشر...</p>
    </div>
  `;
  
  try {
    let downloadUrl, filename;
    
    if (currentDownloadType === 'video') {
      downloadUrl = currentVideoData.play;
      filename = `clipvault_${quality}p_${Date.now()}.mp4`;
    } else if (currentDownloadType === 'mp3') {
      downloadUrl = currentVideoData.music;
      filename = `clipvault_audio_${Date.now()}.mp3`;
    } else if (currentDownloadType === 'story') {
      downloadUrl = currentVideoData.play;
      filename = `clipvault_story_${quality}p_${Date.now()}.mp4`;
    }

    // طريقة التحميل المباشر باستخدام fetch و Blob
    showAlert(`جاري التحميل بجودة ${quality}p...`);
    
    // جلب الملف كـ Blob
    const response = await fetch(downloadUrl);
    const blob = await response.blob();
    
    // إنشاء رابط للتحميل
    const blobUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = blobUrl;
    link.download = filename;
    link.style.display = 'none';
    
    // إضافة إلى الجسم والنقر
    document.body.appendChild(link);
    link.click();
    
    // تنظيف بعد التحميل
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(blobUrl);
    }, 100);
    
    // إظهار رسالة النجاح
    setTimeout(() => {
      resultDiv.innerHTML = `
        <div class="success-result">
          <div class="result-header">
            <i class="fa-solid fa-circle-check"></i>
            <h3>تم التحميل بنجاح!</h3>
          </div>
          <p>تم تحميل ${currentDownloadType === 'video' ? 'الفيديو' : currentDownloadType === 'mp3' ? 'الصوت' : 'القصة'} بجودة ${quality}p بنجاح</p>
          <p style="font-size: 14px; color: var(--text-secondary); margin-top: 15px;">
            تم حفظ الملف في مجلد التنزيلات
          </p>
        </div>
      `;
    }, 1000);
    
    showAlert('✅ تم التحميل بنجاح!');
    
  } catch (error) {
    console.error('Error:', error);
    resultDiv.innerHTML = `
      <div class="error-result">
        <div class="result-header">
          <i class="fa-solid fa-circle-xmark"></i>
          <h3>خطأ في التحميل</h3>
        </div>
        <p>${error.message || 'حدث خطأ غير متوقع'}</p>
        <button class="retry-btn" onclick="downloadWithQuality('${quality}')">
          <i class="fa-solid fa-rotate"></i>
          إعادة المحاولة
        </button>
      </div>
    `;
  }
}

// دالة عرض التنبيهات
function showAlert(message) {
  const alertDiv = document.createElement('div');
  alertDiv.className = 'custom-alert';
  alertDiv.innerHTML = `
    <div class="alert-content">
      <i class="fa-solid fa-circle-info"></i>
      <span>${message}</span>
    </div>
  `;
  
  document.body.appendChild(alertDiv);
  
  setTimeout(() => {
    alertDiv.classList.add('show');
  }, 100);
  
  setTimeout(() => {
    alertDiv.classList.remove('show');
    setTimeout(() => {
      document.body.removeChild(alertDiv);
    }, 300);
  }, 3000);
}

// إضافة Event Listeners للأزرار الرئيسية
document.getElementById('btn-video').addEventListener('click', () => showQualityOptions('video'));
document.getElementById('btn-story').addEventListener('click', () => showQualityOptions('story'));

// إضافة Event Listeners لأزرار الجودة
document.querySelectorAll('.quality-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const quality = btn.getAttribute('data-quality');
    downloadWithQuality(quality);
  });
});

// السماح بالضغط على Enter
document.getElementById('videoUrl').addEventListener('keypress', function(e) {

let currentTranslations = translations.AR;

function applyTranslations(lang) {
  const t = translations[lang] || translations.EN;
  currentTranslations = t;

  // تحديث جميع النصوص في الموقع
  const elementsToTranslate = {
    'main-title': t.mainTitle,
    'main-desc': t.mainDesc,
    'feature1-title': t.feature1Title,
    'feature1-text': t.feature1Text,
    'feature1-extra': t.feature1Extra,
    'feature2-title': t.feature2Title,
    'feature2-text': t.feature2Text,
    'feature2-extra': t.feature2Extra,
    'feature3-title': t.feature3Title,
    'feature3-text': t.feature3Text,
    'feature3-extra': t.feature3Extra,
    'feature4-title': t.feature4Title,
    'feature4-text': t.feature4Text,
    'feature4-extra': t.feature4Extra,
    'faq1-summary': t.faq1,
    'faq1-text': t.faq1Ans,
    'faq2-summary': t.faq2,
    'faq2-text': t.faq2Ans,
    'faq3-summary': t.faq3,
    'faq3-text': t.faq3Ans,
    'faq4-summary': t.faq4,
    'faq4-text': t.faq4Ans,
    'info-title': t.infoTitle,
    'info-desc': t.infoDesc,
    'info-browser-title': t.infoBrowserTitle,
    'info-browser-desc': t.infoBrowserDesc,
    'faq-android-title': t.faqAndroidSummary,
    'faq-android-text': t.faqAndroidText,
    'faq-ios-title': t.faqIosSummary,
    'faq-ios-text': t.faqIosText,
    'faq-pc-title': t.faqPcSummary,
    'faq-pc-text': t.faqPcText,
    'info-security-title': t.infoSecurityTitle,
    'info-security-text': t.infoSecurityText,
    'footer-text': t.footer,
    'contact-title': t.contactTitle,
    'quality-title': t.qualityTitle
  };

  // تطبيق الترجمات
  Object.keys(elementsToTranslate).forEach(id => {
    const element = document.getElementById(id);
    if (element) {
      element.textContent = elementsToTranslate[id];
    }
  });

  // تحديث الأزرار
  document.getElementById('btn-video').innerHTML = `<i class="fa-solid fa-download"></i><span>${t.btnVideo}</span>`;
  document.getElementById('btn-story').innerHTML = `<i class="fa-solid fa-images"></i><span>${t.btnStory}</span>`;
  document.getElementById('btn-mp3').innerHTML = `<i class="fa-solid fa-music"></i><span>${t.btnMp3}</span>`;

  // تحديث العناصر الأخرى
  document.getElementById('videoUrl').placeholder = t.placeholder;
  document.getElementById('langBtn').textContent = `🌐 ${t.langLabel}`;

  // تحديث نموذج الاتصال
  const nameInput = document.querySelector('#contact-form input[name="from_name"]');
  const emailInput = document.querySelector('#contact-form input[name="from_email"]');
  const msgTextarea = document.querySelector('#contact-form textarea[name="message"]');
  const sendBtn = document.querySelector('#contact-form button.send span');
  const cancelBtn = document.querySelector('#contact-form button.cancel span');

  if (nameInput) nameInput.placeholder = t.contactName;
  if (emailInput) emailInput.placeholder = t.contactEmail;
  if (msgTextarea) msgTextarea.placeholder = t.contactMessage;
  if (sendBtn) sendBtn.textContent = t.send;
  if (cancelBtn) cancelBtn.textContent = t.cancel;

  // تحديث اتجاه الصفحة
  document.documentElement.lang = lang.toLowerCase();
  document.documentElement.dir = lang === 'AR' ? 'rtl' : 'ltr';
}

// تطبيق الترجمة عند النقر على اللغة
document.querySelectorAll('#langMenu div[data-lang]').forEach(el => {
  el.addEventListener('click', () => {
    const lang = el.getAttribute('data-lang');
    applyTranslations(lang);
    langMenu.style.display = 'none';
    langMenu.setAttribute('aria-hidden', 'true');
  });
});

document.getElementById('contact-form').addEventListener('submit', function(e) {
  e.preventDefault();
  alert(currentTranslations.send ? `${currentTranslations.contactTitle} — ${currentTranslations.send}!` : 'Message sent!');
  document.getElementById('contactModal').style.display = 'none';
  this.reset();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('contactModal').style.display === 'flex') {
    document.getElementById('contactModal').style.display = 'none';
  }
});
</script>
