<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TikTok Saver - تحميل فيديوهات تيك توك</title>
    <meta name="description" content="تحميل فيديوهات تيك توك بدون علامة مائية - سريع ومجاني">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .logo i {
            color: #ff0050;
            margin-right: 10px;
        }

        .title {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #ccc;
            font-size: 1.1rem;
        }

        .download-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .url-input {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
        }

        .url-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.3);
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-video {
            background: linear-gradient(45deg, #ff0050, #ff0050);
            color: white;
        }

        .btn-mp3 {
            background: linear-gradient(45deg, #00f2fe, #00f2fe);
            color: white;
        }

        .btn-story {
            background: linear-gradient(45deg, #25d366, #25d366);
            color: white;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .result {
            margin-top: 20px;
            min-height: 100px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid #00f2fe;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .error {
            background: rgba(255, 0, 80, 0.1);
            border: 1px solid #ff0050;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .download-link {
            display: inline-block;
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 80, 0.4);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .feature i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #00f2fe;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #25d366, #25d366);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .alert.show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .url-input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fab fa-tiktok"></i>
                <span class="title">TikTok Saver</span>
            </div>
            <p class="subtitle">حمل فيديوهات تيك توك بدون علامة مائية - سريع ومجاني</p>
        </div>

        <div class="download-box">
            <div class="input-group">
                <input type="url" class="url-input" id="videoUrl" placeholder="الصق رابط تيك توك هنا..." autocomplete="off">
                <button class="btn btn-video" id="btnVideo">
                    <i class="fas fa-download"></i>
                    تحميل فيديو
                </button>
                <button class="btn btn-mp3" id="btnMp3">
                    <i class="fas fa-music"></i>
                    تحميل MP3
                </button>
            </div>
            
            <div class="result" id="result">
                <!-- النتائج تظهر هنا -->
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <i class="fas fa-bolt"></i>
                <h3>سريع</h3>
                <p>تحميل فوري بدون انتظار</p>
            </div>
            <div class="feature">
                <i class="fas fa-shield-alt"></i>
                <h3>آمن</h3>
                <p>لا نحفظ بياناتك</p>
            </div>
            <div class="feature">
                <i class="fas fa-ban"></i>
                <h3>بدون علامة مائية</h3>
                <p>فيديوهات نظيفة</p>
            </div>
        </div>
    </div>

    <script>
        // دالة التحميل المباشرة
        async function downloadContent(type) {
            const url = document.getElementById("videoUrl").value.trim();
            const resultDiv = document.getElementById("result");
            const btnVideo = document.getElementById('btnVideo');
            const btnMp3 = document.getElementById('btnMp3');
            
            if (!url) {
                showAlert("⚠️ الرجاء إدخال رابط تيك توك");
                return;
            }

            if (!url.includes('tiktok.com')) {
                showAlert("❌ الرجاء إدخال رابط تيك توك صحيح");
                return;
            }

            // إظهار حالة التحميل
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>جاري تحضير ${type === 'video' ? 'الفيديو' : 'الصوت'} للتحميل...</p>
                </div>
            `;

            // تعطيل الأزرار أثناء التحميل
            btnVideo.disabled = true;
            btnMp3.disabled = true;

            try {
                // استخدام API سريع ومباشر
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                        'Accept': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    let downloadUrl, filename;
                    
                    if (type === 'video') {
                        downloadUrl = data.data.play;
                        filename = `tiktok_video_${Date.now()}.mp4`;
                    } else if (type === 'mp3') {
                        downloadUrl = data.data.music;
                        filename = `tiktok_audio_${Date.now()}.mp3`;
                    }
                    
                    // إنشاء رابط تحميل مخفي
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = filename;
                    link.style.display = 'none';
                    
                    // إضافة الرابط للصفحة والنقر عليه
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // إظهار رسالة النجاح
                    resultDiv.innerHTML = `
                        <div class="success">
                            <i class="fas fa-check-circle" style="font-size: 3rem; color: #00f2fe; margin-bottom: 15px;"></i>
                            <h3>✅ تم البدء في التحميل!</h3>
                            <p>جاري تحميل ${type === 'video' ? 'الفيديو' : 'الصوت'} إلى جهازك...</p>
                            <p style="margin-top: 10px; font-size: 14px; color: #ccc;">
                                إذا لم يبدأ التحميل تلقائياً، 
                                <a href="${downloadUrl}" download="${filename}" class="download-link">
                                    اضغط هنا للتحميل
                                </a>
                            </p>
                        </div>
                    `;
                    
                    showAlert('🎉 بدأ التحميل! تحقق من مجلد التنزيلات');
                    
                } else {
                    throw new Error(data.msg || 'فشل في تحميل المحتوى');
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff0050; margin-bottom: 15px;"></i>
                        <h3>❌ خطأ في التحميل</h3>
                        <p>${error.message || 'حدث خطأ غير متوقع'}</p>
                        <button class="download-link" onclick="downloadContent('${type}')" style="background: #ff0050; border: none; cursor: pointer;">
                            إعادة المحاولة
                        </button>
                    </div>
                `;
            } finally {
                // إعادة تفعيل الأزرار
                btnVideo.disabled = false;
                btnMp3.disabled = false;
            }
        }

        // دالة عرض التنبيهات
        function showAlert(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert';
            alertDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-info-circle"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                alertDiv.classList.remove('show');
                setTimeout(() => {
                    if (document.body.contains(alertDiv)) {
                        document.body.removeChild(alertDiv);
                    }
                }, 300);
            }, 3000);
        }

        // إضافة event listeners
        document.getElementById('btnVideo').addEventListener('click', () => downloadContent('video'));
        document.getElementById('btnMp3').addEventListener('click', () => downloadContent('mp3'));

        // السماح بالضغط على Enter
        document.getElementById('videoUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                downloadContent('video');
            }
        });

        // التركيز على حقل الإدخال عند تحميل الصفحة
        window.addEventListener('load', function() {
            document.getElementById('videoUrl').focus();
        });

        // نسخ الرابط تلقائياً عند النقر على الحقل
        document.getElementById('videoUrl').addEventListener('click', function() {
            this.select();
        });
    </script>
</body>
</html>
